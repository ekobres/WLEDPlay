services:
  wledplay:
    build:
      context: .
      args:
        WLEDPLAY_SHAIRPORT_PATCH: ${WLEDPLAY_SHAIRPORT_PATCH:-0}
        WLEDPLAY_NQPTP_PATCH: ${WLEDPLAY_NQPTP_PATCH:-0}
    image: "${WLEDPLAY_IMAGE:-ghcr.io/ekobres/wledplay:latest}"
    container_name: wledplay
    network_mode: host
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    volumes:
      # Local yaml/conf are gitignored. ./scripts/ensure-config.sh copies examples
      # if missing. Entrypoint prefers local files, then examples, then image defaults.
      - ./config:/host-config
      # Host zone file, so WLEDPlay log timestamps match local time.
      - /etc/localtime:/etc/localtime:ro
      # Read-only host service sockets; entrypoint uses these only in host Avahi mode.
      - /run/dbus:/host/run/dbus:ro
      - /run/avahi-daemon:/host/run/avahi-daemon:ro
    environment:
      WLEDPLAY_AIRPLAY_NAME: "${WLEDPLAY_AIRPLAY_NAME:-}"
      WLEDPLAY_MULTICAST_ADDRESS: "${WLEDPLAY_MULTICAST_ADDRESS:-239.0.0.1}"
      WLEDPLAY_PORT: "${WLEDPLAY_PORT:-11988}"
      WLEDPLAY_LOG_LEVEL: "info"
      WLEDPLAY_DESTINATION: "${WLEDPLAY_DESTINATION:-}"
      WLEDPLAY_HTTP_INTERFACE: "${WLEDPLAY_HTTP_INTERFACE:-}"
      WLEDPLAY_AIRPLAY_INTERFACE: "${WLEDPLAY_AIRPLAY_INTERFACE:-}"
      WLEDPLAY_UNICAST_INTERFACE: "${WLEDPLAY_UNICAST_INTERFACE:-}"
      WLEDPLAY_MULTICAST_INTERFACE: "${WLEDPLAY_MULTICAST_INTERFACE:-}"
      WLEDPLAY_WEB_LISTEN: "${WLEDPLAY_WEB_LISTEN:-0.0.0.0}"
      WLEDPLAY_WEB_PORT: "${WLEDPLAY_WEB_PORT:-8080}"
      WLEDPLAY_METADATA_PIPE: "${WLEDPLAY_METADATA_PIPE:-/run/wledplay.meta}"
      WLEDPLAY_SHAIRPORT_LATENCY_OFFSET: "${WLEDPLAY_SHAIRPORT_LATENCY_OFFSET:-}"
      WLEDPLAY_PCM_RATE: "48000"
      WLEDPLAY_AVAHI_MODE: "${WLEDPLAY_AVAHI_MODE:-auto}"
      ENABLE_AVAHI: "${ENABLE_AVAHI:-}"
      WLEDPLAY_IPV4_ONLY: "${WLEDPLAY_IPV4_ONLY:-0}"
