services:
  wledplay:
    build: .
    image: ghcr.io/wledplay/wledplay:latest
    container_name: wledplay
    network_mode: host
    restart: unless-stopped
    environment:
      WLEDPLAY_AIRPLAY_NAME: "WLEDPlay"
      WLEDPLAY_MULTICAST_ADDRESS: "239.0.0.1"
      WLEDPLAY_PORT: "11988"
      WLEDPLAY_LOG_LEVEL: "info"
      WLEDPLAY_DESTINATION: "${WLEDPLAY_DESTINATION:-}"
      WLEDPLAY_INTERFACE: "${WLEDPLAY_INTERFACE:-}"
      WLEDPLAY_SHAIRPORT_LATENCY_OFFSET: "${WLEDPLAY_SHAIRPORT_LATENCY_OFFSET:-}"
      WLEDPLAY_PCM_RATE: "48000"
      ENABLE_AIRPLAY2: "1"
      ENABLE_AVAHI: "${ENABLE_AVAHI:-1}"
