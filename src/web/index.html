<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WLEDPlay</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #141a2e;
      --line: #243049;
      --text: #e8eefc;
      --muted: #8b97b3;
      --ok: #3ee0a0;
      --idle: #6b7590;
      --peak: #ff5c7a;
      --bar: #5b8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.45 ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header, main { max-width: 880px; margin: 0 auto; padding: 20px; }
    header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 1.4rem; letter-spacing: 0.04em; }
    .pill {
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.78rem;
      background: #1d243c;
      color: var(--idle);
    }
    .pill.live { color: var(--ok); background: #143528; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .track-card { display: flex; gap: 12px; align-items: center; }
    #art {
      width: 72px; height: 72px; object-fit: cover; border-radius: 8px;
      background: #0e1424; flex-shrink: 0;
    }
    .value { font-size: 1.15rem; margin-top: 4px; word-break: break-word; }
    .value.peak { color: var(--peak); }
    .meter { height: 10px; background: #0e1424; border-radius: 6px; overflow: hidden; margin-top: 8px; }
    .meter > span { display: block; height: 100%; width: 0; background: var(--bar); }
    .bands {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 4px;
      height: 140px;
      align-items: end;
      margin-top: 12px;
    }
    .bands i {
      display: block;
      background: linear-gradient(180deg, #8ec5ff, var(--bar));
      border-radius: 3px 3px 0 0;
      min-height: 2px;
      height: 2%;
    }
    pre { margin: 8px 0 0; color: var(--muted); font-size: 0.78rem; overflow: auto; }
    .controls label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .controls input, .controls select, .controls textarea {
      width: 100%; background: #0e1424; color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 10px; font: inherit;
    }
    .controls textarea { min-height: 72px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
    button {
      background: #2a3a66; color: var(--text); border: 0; border-radius: 8px;
      padding: 8px 14px; font: inherit; cursor: pointer;
    }
    button.danger { background: #5a2433; }
    .hint { color: var(--muted); font-size: 0.85rem; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .check input { width: auto; }
  </style>
</head>
<body>
  <header>
    <h1>WLEDPlay</h1>
    <span id="conn" class="pill">idle</span>
    <span id="ver" class="pill"></span>
  </header>
  <main>
    <div class="grid">
      <div class="card">
        <div class="label">Receiver</div>
        <div class="value" id="receiver">—</div>
      </div>
      <div class="card track-card">
        <img id="art" alt="" hidden>
        <div>
          <div class="label">Track</div>
          <div class="value" id="track">No metadata yet</div>
        </div>
      </div>
      <div class="card">
        <div class="label">Level</div>
        <div class="value" id="level">0%</div>
        <div class="meter"><span id="levelbar"></span></div>
      </div>
      <div class="card">
        <div class="label">Dominant frequency</div>
        <div class="value" id="freq">—</div>
      </div>
      <div class="card">
        <div class="label">Packet rate</div>
        <div class="value" id="pps">0 /s</div>
      </div>
      <div class="card">
        <div class="label">Destinations</div>
        <div class="value" id="dest">—</div>
      </div>
      <div class="card">
        <div class="label">Sync offset</div>
        <div class="value" id="sync">0 ms</div>
      </div>
      <div class="card">
        <div class="label">Stream</div>
        <div class="value" id="stream">0s · 0 connects</div>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="label">16 FFT bands</div>
      <div class="bands" id="bands"></div>
      <pre id="counters"></pre>
    </div>
    <div class="card controls" style="margin-top:12px">
      <div class="label">Operator controls</div>
      <label for="ctl-delay">Visual delay (ms) — live; negative pulls PCM earlier (restart)</label>
      <input id="ctl-delay" type="number" step="50" min="-5000" max="5000">
      <label for="ctl-name">AirPlay name — restart to re-advertise</label>
      <input id="ctl-name" type="text" maxlength="64">
      <label for="ctl-iface">Network interface — restart</label>
      <select id="ctl-iface"></select>
      <div class="check">
        <input id="ctl-mcast" type="checkbox">
        <span>Send multicast</span>
      </div>
      <label for="ctl-dest">Unicast destinations (one IP per line)</label>
      <textarea id="ctl-dest"></textarea>
      <div class="row">
        <button id="ctl-save" type="button">Save</button>
        <button id="ctl-restart" class="danger" type="button">Restart stack</button>
        <span class="hint" id="ctl-msg"></span>
      </div>
    </div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const bandsEl = $("bands");
    for (let i = 0; i < 16; i++) bandsEl.appendChild(document.createElement("i"));
    const bars = [...bandsEl.children];

    let updateHz = 50;
    let lastMeta = 0;

    function paintSpectrum(s) {
      const live = !!s.airplay.connected;
      $("conn").textContent = live ? "live" : "idle";
      $("conn").className = "pill" + (live ? " live" : "");
      const rms = Number(s.audio.rms || 0);
      $("level").textContent = Math.round(rms * 100) + "%" + (s.audio.peak ? "  peak" : "");
      $("level").className = "value" + (s.audio.peak ? " peak" : "");
      $("levelbar").style.width = Math.min(100, rms * 100) + "%";
      const hz = Number(s.audio.dominant_frequency || 0);
      $("freq").textContent = hz > 1 ? hz.toFixed(1) + " Hz" : "—";
      (s.audio.bands || []).forEach((v, i) => {
        if (bars[i]) bars[i].style.height = Math.max(2, (v / 255) * 100) + "%";
      });
      if (s.audio.update_hz > 0) updateHz = s.audio.update_hz;
    }

    function paintMeta(s) {
      $("ver").textContent = s.version || "";
      $("receiver").textContent = s.airplay.receiver_name || "WLEDPlay";
      const md = s.metadata || {};
      const parts = [md.title, md.artist, md.album].filter(Boolean);
      $("track").textContent = parts.length ? parts.join(" · ") : "No metadata yet";
      const art = $("art");
      if (md.has_artwork) {
        const key = parts.join("|");
        if (art.dataset.key !== key) {
          art.src = "/artwork?t=" + encodeURIComponent(key);
          art.dataset.key = key;
        }
        art.hidden = false;
      } else {
        art.removeAttribute("src");
        art.hidden = true;
        art.dataset.key = "";
      }
      $("pps").textContent = Number(s.wled.packets_per_second || 0).toFixed(0) + " /s";
      $("dest").textContent = (s.wled.destinations && s.wled.destinations.length)
        ? s.wled.destinations.join(", ")
        : (s.wled.destination || "—");
      $("sync").textContent = (s.audio.sync_offset_ms || 0) + " ms";
      $("stream").textContent = Number(s.airplay.stream_duration_s || 0).toFixed(1)
        + "s · " + (s.airplay.connections || 0) + " connects";
      const c = s.counters || {};
      $("counters").textContent =
        "pcm " + (c.pcm_frames || 0)
        + "  fft " + (c.fft_frames || 0)
        + "  packets " + (c.packets_sent || 0)
        + "  udp_err " + (c.udp_errors || 0)
        + "  underrun " + (c.pcm_underruns || 0)
        + "  overrun " + (c.analysis_overruns || 0);
    }

    async function tick() {
      const started = performance.now();
      let s;
      try { s = await fetch("/status").then((r) => r.json()); }
      catch { s = null; }
      if (s) {
        paintSpectrum(s);
        if (started - lastMeta >= 1000) {
          paintMeta(s);
          lastMeta = started;
        }
      }
      const period = 1000 / Math.max(1, updateHz);
      setTimeout(tick, Math.max(0, period - (performance.now() - started)));
    }

    function fillConfig(c) {
      lastConfig = c;
      const v = c.values || {};
      if (document.activeElement !== $("ctl-delay")) $("ctl-delay").value = v.visual_delay_ms ?? 0;
      if (document.activeElement !== $("ctl-name")) $("ctl-name").value = v.airplay_name || "";
      if (document.activeElement !== $("ctl-dest")) $("ctl-dest").value = (v.destinations || []).join("\n");
      $("ctl-mcast").checked = !!v.multicast_enabled;
      const sel = $("ctl-iface");
      const current = v.interface || "";
      if (document.activeElement !== sel) {
        sel.innerHTML = "";
        const any = document.createElement("option");
        any.value = "";
        any.textContent = "All interfaces";
        sel.appendChild(any);
        (c.interfaces || []).forEach((i) => {
          const o = document.createElement("option");
          o.value = i.name;
          o.textContent = i.name + " (" + i.ipv4 + ")";
          sel.appendChild(o);
        });
        sel.value = current;
      }
      const bits = [];
      if (c.needs_restart) bits.push("restart needed");
      if (c.persisted) bits.push("saved");
      else if (c.config_writable === false) bits.push("config not writable");
      if (c.persist_error) bits.push(c.persist_error);
      if (c.persisted || c.needs_restart || c.persist_error || c.config_writable === false) {
        $("ctl-msg").textContent = bits.join(" · ");
      }
    }

    async function loadConfig() {
      try { fillConfig(await fetch("/config").then((r) => r.json())); }
      catch { /* ignore */ }
    }

    let lastConfig = { values: {} };

    $("ctl-save").onclick = async () => {
      const dest = $("ctl-dest").value.split(/\n/).map((s) => s.trim()).filter(Boolean);
      const name = $("ctl-name").value.trim();
      const iface = $("ctl-iface").value;
      const prev = lastConfig.values || {};
      if (Object.prototype.hasOwnProperty.call(prev, "airplay_name")
          && ((name && name !== prev.airplay_name) || iface !== (prev.interface || ""))) {
        if (!confirm("Name or interface changes need a restart and may drop AirPlay. Save anyway?")) {
          return;
        }
      }
      const body = {
        visual_delay_ms: Number($("ctl-delay").value),
        airplay_name: name,
        interface: iface,
        multicast_enabled: $("ctl-mcast").checked,
        destinations: dest
      };
      const r = await fetch("/config", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (!r.ok) {
        $("ctl-msg").textContent = await r.text();
        return;
      }
      fillConfig(await r.json());
    };

    $("ctl-restart").onclick = async () => {
      if (!confirm("Restart WLEDPlay? An AirPlay session may drop.")) return;
      const r = await fetch("/restart", { method: "POST" });
      $("ctl-msg").textContent = r.ok ? "Restarting…" : "Restart failed";
    };

    $("ctl-delay").addEventListener("change", () => $("ctl-save").click());
    $("ctl-mcast").addEventListener("change", () => $("ctl-save").click());

    tick();
    loadConfig();
    setInterval(loadConfig, 4000);
  </script>
</body>
</html>
