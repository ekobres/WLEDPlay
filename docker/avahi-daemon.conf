# Container Avahi. Do not set rlimit-nproc — it prevents startup in Docker.
[server]
use-ipv4=yes
# IPv4 only. On a multi-homed host an IPv6 AirPlay session delivers RTSP
# metadata while NQPTP never locks, so the stdout backend stays silent.
use-ipv6=no
enable-dbus=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000
#allow-interfaces=

[wide-area]
enable-wide-area=yes

[publish]
publish-hinfo=no
publish-workstation=no

[reflector]
enable-reflector=no

[rlimits]
