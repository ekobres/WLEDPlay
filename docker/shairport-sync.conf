// AirPlay 2 + stdout (Linux / Docker host networking).
// NQPTP must be running. Do not use this config on macOS.

general = {
  name = "WLEDPlay";
  output_backend = "stdout";
  mdns = "avahi";
  service_type = "airplay2";
  // interface = "eth0"; // set by WLEDPLAY_INTERFACE / entrypoint
  // Match AirPlay 2 presentation time — do not pull PCM early
  audio_backend_buffer_desired_length_in_seconds = 0.05;
  audio_decoded_buffer_desired_length_in_seconds = 0.15;
  audio_backend_latency_offset_in_seconds = 0.0;
};

sessioncontrol = {
  allow_session_interruption = "yes";
  session_timeout = 60;
  active_state_timeout = 2.0;
};

stdout = {
  output_rate = 48000;
  output_format = "S16_LE";
  output_channels = 2;
};

diagnostics = {
  log_verbosity = 1;
};
