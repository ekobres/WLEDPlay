# Copy to config.yaml and edit. config.yaml is gitignored so pulls
# do not overwrite local destinations, NICs, or delay calibration.
#
#   cp config/config-example.yaml config/config.yaml

airplay:
  name: "WLEDPlay"

audio:
  sync_offset_ms: 1200
  shairport_latency_offset_s: -1.2
  # WLED soundAgc: off | normal | vivid | lazy  (`auto` = normal). Live.
  gain: normal
  update_hz: 50

wled:
  multicast_address: "239.0.0.1"
  port: 11988
  destinations:
    # Documentation address. Replace with your WLED controller.
    # Control Save rewrites this list from controllers whose unicast flag is true.
    - "192.0.2.10"
  controllers:
    - address: "192.0.2.10"
      name: "Controller A"
      unicast: true
      delay_ms: 0
      manual: true
      name_locked: false
  dismissed: []
  multicast_enabled: true

# Bind each traffic type to a host NIC (`ip -br addr`). Empty = no pin.
# HTTP empty uses web.listen (default 0.0.0.0). UDP empty uses the kernel route.
# Example three-VLAN host: http=mgmt, airplay=user, unicast+multicast=IoT.
network:
  http: ""
  airplay: ""
  unicast: ""
  multicast: ""

logging:
  # error, warn, info, debug, or trace. The Logs card can change this while running.
  level: info

web:
  enabled: true
  listen: "0.0.0.0"
  port: 8080

metadata:
  pipe: ""

# Live. Joins the selected speaker's AirPlay group only while WLEDPlay is idle.
# target_id is the stable AirPlay output id; target_name is display-only.
auto_join:
  enabled: false
  target_id: ""
  target_name: ""

pcm:
  # File and stdin default. The container passes --pcm-rate 48000, which replaces this.
  rate: 44100
  channels: 2
  format: s16le
