// Copy to shairport-sync.conf and edit. shairport-sync.conf is gitignored
// so pulls do not overwrite local buffers, session, or diagnostics.
//
//   cp config/shairport-sync-example.conf config/shairport-sync.conf
//
// Docker Compose mounts ./config and prefers the local file, then this
// example, then the copy baked into the image. Name, interface, lead, and
// metadata pipe are patched at start from yaml/env.

general = {
  name = "WLEDPlay";
  output_backend = "stdout";
  mdns = "avahi";
  service_type = "airplay2";
  // interface = "eth0"; // set by WLEDPLAY_AIRPLAY_INTERFACE / yaml network.airplay
  audio_backend_buffer_desired_length_in_seconds = 0.05;
  audio_decoded_buffer_desired_length_in_seconds = 0.15;
  // Negative = write PCM earlier so visuals catch the speakers.
  // Overridden at start by audio.shairport_latency_offset_s / WLEDPLAY_SHAIRPORT_LATENCY_OFFSET.
  audio_backend_latency_offset_in_seconds = -1.2;
};

sessioncontrol = {
  allow_session_interruption = "yes";
  session_timeout = 60;
  active_state_timeout = 2.0;
};

stdout = {
  output_rate = 48000;
  output_format = "S16_LE";
  output_channels = 2;
};

metadata = {
  enabled = "yes";
  include_cover_art = "yes";
  pipe_name = "/run/wledplay.meta";
  pipe_timeout = 5000;
};

diagnostics = {
  log_verbosity = 1;
};
