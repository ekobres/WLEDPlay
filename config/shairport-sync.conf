// Native / macOS Shairport Sync config for WLEDPlay (AirPlay 1 + stdout).
// Homebrew builds include stdout and Bonjour (dns_sd). Do not set mdns = "avahi".

general = {
  name = "WLEDPlay";
  output_backend = "stdout";
  // interface = "eth0"; // set by WLEDPLAY_INTERFACE
  // stdout is not a DAC — keep almost no backend buffer or pause drains for seconds
  audio_backend_buffer_desired_length_in_seconds = 0.05;
  audio_decoded_buffer_desired_length_in_seconds = 0.15;
  // Write PCM earlier than AirPlay presentation time so visuals are closer to the sender
  audio_backend_latency_offset_in_seconds = -1.0;
};

sessioncontrol = {
  // Apple Music reconnects fail if the previous classic session is still "busy"
  allow_session_interruption = "yes";
  session_timeout = 60;
  active_state_timeout = 2.0;
};

stdout = {
  output_rate = 44100;
  output_format = "S16_LE";
  output_channels = 2;
};

metadata = {
  enabled = "yes";
  include_cover_art = "yes";
  pipe_name = "/tmp/wledplay.meta";
  pipe_timeout = 5000;
};
