airplay:
  name: "WLEDPlay"

audio:
  sync_offset_ms: 0
  gain: auto
  update_hz: 50

wled:
  multicast_address: "239.0.0.1"
  port: 11988
  destinations:
    - "10.11.1.124"

# Host NIC for AirPlay + WLED UDP on a multi-homed machine (e.g. eth1).
# HTTP still listens on web.listen (default 0.0.0.0) so the management IP works.
# Override with WLEDPLAY_INTERFACE. Empty = all interfaces.
network:
  interface: ""

logging:
  level: info

web:
  enabled: true
  listen: "0.0.0.0"
  port: 8080

metadata:
  pipe: ""

pcm:
  rate: 44100
  channels: 2
  format: s16le
